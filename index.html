<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <link rel="icon" type="image/webp" href="/tab.webp">

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: Plus Jakarta Sans + Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Default SEO (overridden per-page by React) -->
    <title>ARWEBX | Modern Websites for Growing Businesses</title>
    <meta
      name="description"
      content="ARWEBX builds fast, modern, conversion-focused websites and web applications that help businesses build trust and turn visitors into real enquiries."
    />
    <link rel="canonical" href="https://arwebx.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ARWEBX" />
    <meta property="og:title" content="ARWEBX | Modern Websites for Growing Businesses" />
    <meta
      property="og:description"
      content="ARWEBX builds fast, modern, conversion-focused websites and web applications that help businesses build trust and turn visitors into real enquiries."
    />
    <meta property="og:url" content="https://arwebx.in/" />
    <meta property="og:image" content="https://arwebx.in/og_img.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ARWEBX | Modern Websites for Growing Businesses" />
    <meta
      name="twitter:description"
      content="ARWEBX builds fast, modern, conversion-focused websites and web applications that help businesses build trust and turn visitors into real enquiries."
    />
    <meta name="twitter:image" content="https://arwebx.in/og_img.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "ARWEBX",
        "url": "https://arwebx.in",
        "telephone": "+918332837703",
        "description": "Freelance web development studio specialising in high-performance websites, landing pages, and custom web applications.",
        "serviceType": ["Web Development", "Web Design", "Landing Pages", "Custom Web Applications"],
        "areaServed": "Worldwide",
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
